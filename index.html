<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Control</title>
    <!-- Подключение Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #8A3CF4;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Карточка с SVG-иконкой */
        .history-link-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .history-link-card:active {
            transform: scale(0.98);
        }

        .svg-icon {
            width: 100%;
            max-width: 280px;
            height: auto;
        }

        /* Общий баланс */
        .balance-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
        }

        /* Список транзакций */
        .transactions-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .date-divider {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .transaction-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-title {
            font-size: 15px;
            font-weight: 600;
        }

        .tx-category {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tx-amount {
            font-size: 16px;
            font-weight: bold;
        }

        .tx-amount.income {
            color: #4CAF50;
        }

        .tx-amount.expense {
            color: #FF5252;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Интерактивный блок с новым SVG -->
    <div class="history-link-card" id="openHistory">
        <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <defs>
            <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3B52F6" />
              <stop offset="45%" stop-color="#8A3CF4" />
              <stop offset="100%" stop-color="#E048C8" />
            </linearGradient>
          </defs>

          <!-- Темный фон -->
          <rect width="512" height="512" fill="#000000" rx="32" />

          <!-- Контур банковской карты -->
          <path d="M 275,148 H 68 A 36,36 0 0,0 32,184 V 416 A 36,36 0 0,0 68,452 H 444 A 36,36 0 0,0 480,416 V 270" 
                fill="none" stroke="url(#neonGradient)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Разделительная линия карты -->
          <line x1="32" y1="298" x2="480" y2="298" stroke="url(#neonGradient)" stroke-width="15" />

          <!-- EMV-чип (утонченные линии) -->
          <g fill="none" stroke="url(#neonGradient)">
            <rect x="58" y="180" width="96" height="88" rx="18" stroke-width="5" />
            <rect x="91" y="209" width="30" height="30" rx="4" stroke-width="4" />
            <line x1="58" y1="224" x2="91" y2="224" stroke-width="4" />
            <line x1="121" y1="224" x2="154" y2="224" stroke-width="4" />
            <line x1="106" y1="180" x2="106" y2="209" stroke-width="4" />
            <line x1="106" y1="239" x2="106" y2="268" stroke-width="4" />
            <path d="M 76,180 V 204 A 12,12 0 0,0 88,216 H 91" stroke-width="4" stroke-linecap="round" />
            <path d="M 136,180 V 204 A 12,12 0 0,1 124,216 H 121" stroke-width="4" stroke-linecap="round" />
            <path d="M 76,268 V 244 A 12,12 0 0,1 88,232 H 91" stroke-width="4" stroke-linecap="round" />
            <path d="M 136,268 V 244 A 12,12 0 0,0 124,232 H 121" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- Номер карты (опущен ниже) -->
          <g fill="url(#neonGradient)" stroke="url(#neonGradient)" stroke-width="1.5" font-family="monospace, 'Courier New', sans-serif" font-weight="900" font-size="26" letter-spacing="2">
            <text x="50" y="388">4532</text>
            <text x="154" y="388">7812</text>
            <text x="258" y="388">3456</text>
            <text x="362" y="388">9012</text>
          </g>

          <!-- Плашка истории операций -->
          <rect x="285" y="60" width="195" height="195" rx="42" fill="none" stroke="url(#neonGradient)" stroke-width="15" stroke-linejoin="round" />

          <!-- Стрелки обмена -->
          <g fill="url(#neonGradient)">
            <path d="M 330,146 C 330,128 348,116 368,116 H 410 V 98 L 466,131 L 410,164 V 146 Z" />
            <path d="M 435,179 C 435,197 417,209 397,209 H 355 V 227 L 299,194 L 355,161 V 179 Z" />
          </g>
        </svg>
    </div>

    <!-- Общий баланс -->
    <div class="balance-card">
        <div class="balance-title">Общий баланс</div>
        <div class="balance-amount" id="totalBalance">0 ₽</div>
    </div>

    <!-- История операций -->
    <div class="transactions-section" id="transactionList">
        <div class="date-divider">Сегодня</div>
        
        <div class="transaction-card">
            <div class="tx-info">
                <div class="tx-title">Супермаркет</div>
                <div class="tx-category">Продукты</div>
            </div>
            <div class="tx-amount expense">-1 250 ₽</div>
        </div>

        <div class="transaction-card">
            <div class="tx-info">
                <div class="tx-title">Перевод</div>
                <div class="tx-category">Пополнение</div>
            </div>
            <div class="tx-amount income">+5 000 ₽</div>
        </div>
    </div>

</div>

<script>
    // Инициализация Supabase (укажите свои SUPABASE_URL и SUPABASE_KEY)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Логика клика по карте
    document.getElementById('openHistory').addEventListener('click', () => {
        console.log('Переход к подробной истории операций...');
    });
</script>

</body>
</html>
