<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #333; }
    h2 { margin-top: 0; font-size: 1.2rem; color: #10b981; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 1rem; }
    button { background: #10b981; color: #000; font-weight: bold; border: none; cursor: pointer; }
    button:active { opacity: 0.8; }
    .hidden { display: none; }
    .logout-btn { background: #ef4444; color: #fff; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Блок Авторизации -->
  <div id="auth-section" class="card">
    <h2>Вход / Регистрация</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="signUp()">Зарегистрироваться</button>
    <button onclick="signIn()" style="background:#3b82f6; color:#fff;">Войти</button>
  </div>

  <!-- Главный экран приложения -->
  <div id="app-section" class="card hidden">
    <h2>Life Control</h2>
    <p>Вы вошли как: <b id="user-email"></b></p>
    
    <div style="margin-top:20px;">
      <p>🟢 Бэкенд Supabase подключен!</p>
      <p>🔒 Данные изолированы через RLS.</p>
    </div>

    <button class="logout-btn" onclick="signOut()">Выйти</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://hahjitpsjfyyarbwuany.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tJkQSQCdITF9sqrbGBvg4g_DCRAEZ4O';
    
    const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUser() {
      const { data: { user } } = await dbClient.auth.getUser();
      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
      }
    }

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await dbClient.auth.signUp({ email, password });
      if (error) alert('Ошибка: ' + error.message);
      else alert('Регистрация успешна! Нажмите "Войти".');
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await dbClient.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка: ' + error.message);
      else checkUser();
    }

    async function signOut() {
      await dbClient.auth.signOut();
      checkUser();
    }

    checkUser();
  </script>
</body>
</html>
