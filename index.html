<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Control — История операций</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1c1c1e;
      --card-hover: #26262a;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-yellow: #ffb300;
      --accent-blue: #29b6f6;
      --border-radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-green);
    }

    .view-mode {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* Блок дня */
    .day-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .day-date {
      color: var(--accent-yellow);
    }

    .day-total {
      font-weight: 800;
    }

    .day-total.positive { color: var(--accent-yellow); }
    .day-total.negative { color: var(--accent-red); }

    /* Компактная карточка операции */
    .item-card {
      position: relative;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 8px 12px 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      transition: background-color 0.15s;
    }

    .item-card:hover {
      background-color: var(--card-hover);
    }

    /* Цветовой индикатор слева */
    .item-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-top-left-radius: var(--border-radius);
      border-bottom-left-radius: var(--border-radius);
    }

    .item-card.income::before { background-color: var(--accent-green); }
    .item-card.expense-red::before { background-color: var(--accent-red); }
    .item-card.expense-blue::before { background-color: var(--accent-blue); }

    /* Информация об операции */
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .item-category {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* Сумма и действия */
    .item-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-amount {
      font-size: 14px;
      font-weight: 800;
    }

    .item-amount.positive { color: var(--accent-green); }
    .item-amount.negative { color: var(--accent-red); }

    /* Кнопки действий */
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .btn-icon:hover {
      opacity: 1;
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-sub);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 class="app-title">Life Control</h1>
      <span class="view-mode">Вид: Сбоку</span>
    </header>

    <main id="history-container"></main>
  </div>

  <script>
    // Массив данных операций
    const historyData = [
      {
        date: "14 СЕНТЯБРЯ 2026 Г.",
        dayTotal: "+48 088 ₽",
        isTotalPositive: true,
        items: [
          { id: 1, title: "Зп", category: "Доход", amount: "+90 000 ₽", type: "income" },
          { id: 2, title: "Налог (сентябрь/окт)", category: "1-й порядок", amount: "-7 000 ₽", type: "expense-red" },
          { id: 3, title: "Кредитка Тинькофф", category: "1-й порядок", amount: "-15 000 ₽", type: "expense-red" },
          { id: 4, title: "КУ", category: "1-й порядок", amount: "-2 000 ₽", type: "expense-red" },
          { id: 5, title: "Альфа", category: "1-й порядок", amount: "-1 512 ₽", type: "expense-red" },
          { id: 6, title: "Сплит Я", category: "2-й порядок", amount: "-16 400 ₽", type: "expense-blue" }
        ]
      },
      {
        date: "13 СЕНТЯБРЯ 2026 Г.",
        dayTotal: "-583 ₽",
        isTotalPositive: false,
        items: [
          { id: 7, title: "Зп", category: "Доход", amount: "+500 ₽", type: "income" },
          { id: 8, title: "Такси", category: "1-й порядок", amount: "-500 ₽", type: "expense-red" },
          { id: 9, title: "Шаурма", category: "2-й порядок", amount: "-583 ₽", type: "expense-blue" }
        ]
      }
    ];

    // Отрисовка списка
    function renderHistory() {
      const container = document.getElementById("history-container");
      container.innerHTML = "";

      historyData.forEach(group => {
        const groupEl = document.createElement("div");
        groupEl.className = "day-group";

        const totalClass = group.isTotalPositive ? "positive" : "negative";

        let itemsHTML = group.items.map(item => {
          const amountClass = item.amount.startsWith("+") ? "positive" : "negative";
          return `
            <div class="item-card ${item.type}">
              <div class="item-info">
                <span class="item-title">${item.title}</span>
                <span class="item-category">${item.category}</span>
              </div>
              <div class="item-actions">
                <span class="item-amount ${amountClass}">${item.amount}</span>
                <button class="btn-icon" onclick="editItem(${item.id})" title="Редактировать">
                  <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
                <button class="btn-icon" onclick="deleteItem(${item.id})" title="Удалить">
                  <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join("");

        groupEl.innerHTML = `
          <div class="day-header">
            <span class="day-date">${group.date}</span>
            <span class="day-total ${totalClass}">${group.dayTotal}</span>
          </div>
          ${itemsHTML}
        `;

        container.appendChild(groupEl);
      });
    }

    function editItem(id) {
      console.log("Редактирование операции №:", id);
    }

    function deleteItem(id) {
      console.log("Удаление операции №:", id);
    }

    renderHistory();
  </script>
</body>
</html>
